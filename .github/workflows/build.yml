name: Production build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify public pages without a database
        shell: bash
        run: |
          npm start > "$RUNNER_TEMP/logiclab-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          ready=false
          for attempt in {1..30}; do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$status" = "200" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            cat "$RUNNER_TEMP/logiclab-server.log"
            exit 1
          fi
          login_status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/entrar)
          echo "Login HTTP status: $login_status"
          test "$login_status" = "200"
          dashboard_status=$(curl -s -D "$RUNNER_TEMP/dashboard-headers" -o "$RUNNER_TEMP/dashboard-body" -w '%{http_code}' http://localhost:3000/dashboard)
          echo "Dashboard HTTP status: $dashboard_status"
          cat "$RUNNER_TEMP/dashboard-headers"
          if [ "$dashboard_status" = "307" ]; then
            grep -Eqi '^location: (https?://[^/]+)?/entrar([?[:space:]]|$)' "$RUNNER_TEMP/dashboard-headers"
          else
            test "$dashboard_status" = "200"
            # Streaming responses emit a meta redirect after headers are sent.
            grep -Eqi '<meta[^>]*http-equiv="refresh"[^>]*content="[^"]*/entrar\?' "$RUNNER_TEMP/dashboard-body"
          fi
